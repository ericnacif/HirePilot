  />
  <!-- degraus de evolução -->
  <rect x="8" y="25" width="5.5" height="9" rx="2.75" fill="url(#hp)" opacity="0.42"/>
  <rect x="16" y="19.5" width="5.5" height="14.5" rx="2.75" fill="url(#hp)" opacity="0.68"/>
  <rect x="24" y="14" width="5.5" height="20" rx="2.75" fill="url(#hp)"/>
  <!-- seta — destino / vaga ideal -->
  <path
    d="M26.75 10.5L32.5 8L30.25 13.75L26.75 10.5Z"
    fill="#F6F8FC"
    stroke="url(#hp)"
    stroke-width="1.1"
    stroke-linejoin="round"
  />
  <circle cx="32.5" cy="8" r="2.1" fill="#5D8CFF"/>
  <circle cx="32.5" cy="8" r="0.85" fill="#F6F8FC"/>
