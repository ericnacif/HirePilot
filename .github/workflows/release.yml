name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Lint and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          python -m pytest -q

  build-windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow packaging ruff pytest
          pip install -r requirements-build.txt
          pip install -r requirements-build-full.txt
          pip install -e .
          python scripts/generate_icon.py

      - name: Build HirePilot (Leve)
        run: python -m PyInstaller hirepilot.spec --noconfirm

      - name: Build HirePilot-Full
        run: python -m PyInstaller hirepilot-full.spec --noconfirm

      - name: Prepare portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/portable | Out-Null
          Copy-Item dist/HirePilot.exe dist/portable/
          Copy-Item LEIA-ME.txt dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath dist/HirePilot-portable.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          if (-not $v -or $v -eq '${{ github.ref_name }}') { $v = '1.1.4' }
          (Get-Content installer/hirepilot.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$v`"" | Set-Content installer/hirepilot-built.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/hirepilot-built.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HirePilot-Windows-${{ github.ref_name }}
          path: |
            dist/HirePilot.exe
            dist/HirePilot-Full.exe
            dist/HirePilot-portable.zip
            dist/HirePilot-Setup.exe

      - name: Gerar notas do release
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: HirePilot ${{ github.ref_name }}
          body: |
            ${{ steps.release_notes.outputs.body }}

            ---

            📖 Instruções detalhadas: [INSTALAR.md](https://github.com/ericnacif/HirePilot/blob/main/INSTALAR.md)
          files: |
            dist/HirePilot.exe
            dist/HirePilot-Full.exe
            dist/HirePilot-portable.zip
            dist/HirePilot-Setup.exe
