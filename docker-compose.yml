services:
  vagamatch:
    build: .
    image: vagamatch:latest
    container_name: vagamatch
    ports:
      - "5000:5000"
    environment:
      # Ajuste conforme necessário
      MAX_UPLOAD_MB: "8"
      SEARCH_SOURCES: "gupy,remotive,remoteok"
      USE_SEMANTIC_MATCHING: "false"
      # Defina um segredo fixo para manter as sessões entre reinícios
      # CV_APPLY_SECRET: "troque-este-segredo"
    volumes:
      - vagamatch-data:/app/data
    restart: unless-stopped

volumes:
  vagamatch-data:
