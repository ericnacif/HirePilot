<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HirePilot">
  <defs>
    <linearGradient id="hp" x1="8" y1="8" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5D8CFF"/>
      <stop offset="1" stop-color="#8FB0FF"/>
    </linearGradient>
    <linearGradient id="hp-soft" x1="8" y1="30" x2="34" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5D8CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8FB0FF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- trilha / copiloto -->
  <path
    d="M8 30.5C14 30.5 18 22 22 16.5C25 12.5 28.5 9.5 32.5 8"
